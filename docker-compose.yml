services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: classiq
      POSTGRES_PASSWORD: classiq
      POSTGRES_DB: classiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://classiq:classiq@postgres:5432/classiq
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      LOG_LEVEL: INFO
      SHOTS: "1024"
      CELERY_MAX_RETRIES: "3"
      METRICS_PORT: "9090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    build: .
    command: celery -A app.worker.tasks worker --loglevel=info --concurrency=1 --pool=solo
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql+psycopg://classiq:classiq@postgres:5432/classiq
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      LOG_LEVEL: INFO
      SHOTS: "1024"
      CELERY_MAX_RETRIES: "3"
      METRICS_PORT: "9090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tests:
    build: .
    command: pytest -v
    environment:
      DATABASE_URL: postgresql+psycopg://classiq:classiq@postgres:5432/classiq
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    profiles:
      - test

volumes:
  pgdata:
